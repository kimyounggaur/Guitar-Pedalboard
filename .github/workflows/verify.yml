name: Verify

# PR 과 phase/* 통합 브랜치에서 타입체크·린트·빌드·전체 시험을 돌린다. 배포는 하지 않는다.
# main 에 올라간 뒤의 같은 검사는 deploy.yml 이 배포 앞에서 한다.
# 병합을 막으려면 GitHub 설정(Branches → 보호 규칙)에서 'verify' 를 필수 검사로 지정해야 한다.

on:
  pull_request:
  push:
    branches:
      - 'phase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 반응형 시험이 실제 Chrome 으로 모바일 배치를 잰다. CI 에서 이 파일이 없으면 시험이 실패한다.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # test:pwa 가 dist/ 를 읽으므로 시험보다 먼저 빌드한다.
      - name: Build
        run: npm run build

      - name: Check Chrome
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Test
        run: npm test
